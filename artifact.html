<title>The District</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
  :root { --sky: #a6dcff; color-scheme: light; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--sky); }
  #game {
    position: fixed;
    left: 0; right: 0;
    top: env(safe-area-inset-top, 0px);
    bottom: env(safe-area-inset-bottom, 0px);
    width: 100%;
    height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    display: block;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
</style>
<canvas id="game" aria-label="The District. Swipe across the overgrown grass to cut it and earn cash, then buy the café."></canvas>
<script type="module" src="src/main.js"></script>
