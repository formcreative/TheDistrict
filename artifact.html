<title>Street Story</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/" } }
</script>
<div id="app">
  <canvas id="scene" aria-label="Street Story. Swipe across the lawn to mow it, tap shops to buy and run them."></canvas>
  <div id="world-ui"></div>
  <header id="topbar">
    <div id="cash-pill"><span class="coin"></span><span id="cash">$0</span><span id="rate" hidden></span></div>
    <button id="settings-btn" class="round-btn" aria-label="Settings"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6l5 7 8-3 2 8 8 2-3 8 7 5-7 5 3 8-8 2-2 8-8-3-5 7-5-7-8 3-2-8-8-2 3-8-7-5 7-5-3-8 8-2 2-8 8 3z" fill="#fff" stroke="#23284a" stroke-width="4" stroke-linejoin="round"/><circle cx="32" cy="32" r="8" fill="#2c3d82" stroke="#23284a" stroke-width="4"/></svg></button>
  </header>
  <div id="card" aria-live="polite"></div>
  <div id="hand" hidden></div>
  <div id="toast" aria-live="polite"></div>
  <div id="fly-layer"></div>
  <div id="sheet" hidden></div>
  <div id="modal" hidden></div>
  <div id="boot-error" hidden></div>
</div>
<script type="module" src="src/main.js"></script>
