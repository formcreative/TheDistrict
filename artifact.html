<title>The District</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/" } }
</script>
<div id="loader"><div class="ld-logo"><span class="logo-the">THE</span><span class="logo-main">DISTRICT</span></div><div class="ld-bar"><i></i></div><div class="ld-tip">Loading the neighborhood…</div></div>
<div id="app">
  <canvas id="scene" aria-label="The District. Swipe across the lawn to mow it, tap shops to buy and run them."></canvas>
  <div id="world-ui"></div>
  <header id="topbar">
    <div id="cash-pill"><span class="coin"></span><span id="cash">$0</span><span id="rate" hidden></span><button id="store-btn" aria-label="Store">+</button></div>
    <button id="settings-btn" class="round-btn" aria-label="Settings"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6l5 7 8-3 2 8 8 2-3 8 7 5-7 5 3 8-8 2-2 8-8-3-5 7-5-7-8 3-2-8-8-2 3-8-7-5 7-5-3-8 8-2 2-8 8 3z" fill="#fff" stroke="#23284a" stroke-width="4" stroke-linejoin="round"/><circle cx="32" cy="32" r="8" fill="#2c3d82" stroke="#23284a" stroke-width="4"/></svg></button>
  </header>
  <div id="left-btns"><button id="map-btn" class="round-btn lbtn" aria-label="City map" hidden></button><button id="quest-btn" class="round-btn lbtn" aria-label="Goals" hidden><i class="badge" hidden></i></button></div>
  <div id="rush" hidden></div>
  <div id="zoom">
    <button id="zoom-in" class="round-btn zbtn" aria-label="Zoom in"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="27" cy="27" r="17" fill="#fff" stroke="#23284a" stroke-width="5"/><path d="M39 39l14 14" stroke="#23284a" stroke-width="8" stroke-linecap="round"/><path d="M27 19v16M19 27h16" stroke="#2f4596" stroke-width="5" stroke-linecap="round"/></svg></button>
    <button id="zoom-out" class="round-btn zbtn" aria-label="Back to the street" hidden><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="27" cy="27" r="17" fill="#fff" stroke="#23284a" stroke-width="5"/><path d="M39 39l14 14" stroke="#23284a" stroke-width="8" stroke-linecap="round"/><path d="M19 27h16" stroke="#2f4596" stroke-width="5" stroke-linecap="round"/></svg></button>
  </div>
  <div id="zoom-label"></div>
  <button id="shop-prev" class="round-btn side-btn" aria-label="Previous shop" hidden><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M38 14 20 32l18 18" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button id="shop-next" class="round-btn side-btn" aria-label="Next shop" hidden><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M26 14l18 18-18 18" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div id="card" aria-live="polite"></div>
  <div id="hand" hidden></div>
  <div id="toast" aria-live="polite"></div>
  <div id="fly-layer"></div>
  <div id="sheet" hidden></div>
  <div id="modal" hidden></div>
  <div id="ad" hidden></div>
  <div id="fade" hidden></div>
  <div id="home" hidden></div>
  <div id="boot-error" hidden></div>
</div>
<script type="module" src="src/main.js"></script>
